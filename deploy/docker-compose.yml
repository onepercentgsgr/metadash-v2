version: "3.9"

services:
  backend:
    build: ../backend
    container_name: metadash_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    volumes:
      - backend_data:/app/data
    networks:
      - metadash_net

volumes:
  backend_data:

networks:
  metadash_net:
    driver: bridge
